name: citko

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citko}
      POSTGRES_USER: ${POSTGRES_USER:-citko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: &default_logging
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  migrate:
    build: ./backend
    command: [alembic, upgrade, head]
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-citko}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-citko}
    depends_on:
      db: {condition: service_healthy}
    networks: [app]
    logging: *default_logging
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  fs:
    image: ghcr.io/ferdzo/fs@sha256:70b2fb1f979690eb4c33d4ec11c07a5e15f90577996aac645658f00a91ef7d6b
    restart: unless-stopped
    user: "10001:10001"
    environment:
      PORT: "2600"
      DATA_PATH: /data
      FS_AUTH_ENABLED: "true"
      FS_MASTER_KEY: ${FS_MASTER_KEY:?Set FS_MASTER_KEY in .env}
      FS_ROOT_USER: ${FS_ROOT_USER:?Set FS_ROOT_USER in .env}
      FS_ROOT_PASSWORD: ${FS_ROOT_PASSWORD:?Set FS_ROOT_PASSWORD in .env}
      ADMIN_API_ENABLED: ${ADMIN_API_ENABLED:-false}
    volumes:
      - fs_data:/data
    networks: [app]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2600/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *default_logging
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128

  storage-init:
    build: ./backend
    command: [python, -m, citko.cli, init-storage]
    restart: "no"
    environment: &storage_env
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://fs:2600
      S3_REGION: us-east-1
      S3_BUCKET: citko
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set a scoped S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    depends_on:
      fs: {condition: service_healthy}
    networks: [app]
    logging: *default_logging
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  api:
    build: ./backend
    command: [uvicorn, citko.main:app, --host, 0.0.0.0, --port, "8000"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-citko}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-citko}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      <<: *storage_env
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
    networks: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default_logging
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256

  worker:
    build: ./backend
    command: [python, -m, citko.worker]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-citko}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-citko}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      <<: *storage_env
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
    networks: [app]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default_logging
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [app]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default_logging
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_started}
    networks: [app, edge]
    logging: *default_logging
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

volumes:
  postgres_data:
  fs_data:
  caddy_data:
  caddy_config:

networks:
  app:
    internal: true
  edge:
