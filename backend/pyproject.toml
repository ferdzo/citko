[project]
name = "citko-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "python-multipart>=0.0.20",
  "pwdlib[argon2]>=0.2,<1", "pypdf>=5,<7", "ebooklib>=0.18,<1", "beautifulsoup4>=4.12,<5", "boto3==1.43.114",
  "httpx>=0.28,<1", "Pillow>=10,<12",
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.9"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
